<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f4f2;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#2b6cb0;--bd:#d8d8d3;--pos:#1a7f45;--neg:#b42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#ececea;--mut:#9a9a94;--ac:#6aa5e8;--bd:#383a3d;--pos:#4cc785;--neg:#f0786d}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#ececea;--mut:#9a9a94;--ac:#6aa5e8;--bd:#383a3d;--pos:#4cc785;--neg:#f0786d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px}
main{max-width:1100px;margin:0 auto}
#tab-shiny{max-width:860px;margin:0 auto}
h1{font-size:22px;margin:4px 0 16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:22px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
label,.lbl{display:block;font-size:12px;color:var(--mut);margin-bottom:6px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.val{font-size:22px;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.note{font-size:12px;color:var(--mut);margin-top:6px}
details{margin-top:22px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 12px 12px}
summary{cursor:pointer;padding:12px 0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
details .grid{margin-top:4px}
details .card{background:var(--bg)}
#inputs{grid-template-columns:repeat(3,minmax(0,1fr))}
#inputs input{font-size:16px;padding:8px 6px;min-width:0}
#inputs label{font-size:11px}
#prices{grid-template-columns:repeat(3,minmax(0,1fr))}
#prices input{font-size:16px;padding:8px 6px;min-width:0}
#prices label{font-size:11px}
#outputs{grid-template-columns:1fr 1fr;gap:12px}
#outputs .card{padding:16px 12px;text-align:center;min-height:76px;display:flex;flex-direction:column;justify-content:center}
#outputs .lbl{font-size:13px;margin-bottom:6px}
#outputs .val{font-size:clamp(20px,4.5vw,28px)}
.steps{display:flex;gap:6px;margin-top:6px}
.steps button{flex:1;margin:0;padding:8px 0;font-size:18px;line-height:1;font-weight:600}
.steps button:active{background:var(--ac);color:var(--bg)}
.log{list-style:none;margin:0;padding:0;max-height:320px;overflow-y:auto}
.log li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.log .when{color:var(--mut);font-size:12px;white-space:nowrap}
.log .chg{font-weight:600;white-space:nowrap}
.empty{color:var(--mut);font-size:14px;padding:6px 0}
.small{margin-top:10px;padding:6px 10px;font-size:12px}
[hidden]{display:none!important}
.tabs,.seg{display:flex;gap:6px;margin:4px 0 16px}
.tabs button,.seg button{flex:1;margin:0;padding:10px;font-size:15px;font-weight:600}
.seg{margin:10px 0}.seg button{padding:7px;font-size:13px}
.tabs button.on,.seg button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
#epicList,#holderList{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:700px){#epicList,#holderList{grid-template-columns:repeat(2,minmax(0,1fr))}}
.eph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.eph strong{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{margin:0!important;padding:2px 8px!important;font-size:12px}
.slot{display:flex;align-items:center;gap:8px;margin-top:6px}
.slot span{color:var(--mut);font-size:12px;width:26px;flex:none}
.slot input{font-size:14px;padding:6px}
.slot.hit input{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.ep .steps button{font-size:13px;padding:6px 0}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:2px 8px;margin:4px 4px 0 0;font-size:12px}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow button{margin:0;white-space:nowrap}
.bkt{width:100%;box-sizing:border-box;font:12px monospace;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.armed{background:var(--neg)!important;color:#fff!important;border-color:var(--neg)!important}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://ukgsgiqajqiymaueokeq.supabase.co";
const SB_KEY="sb_publishable_1kETf3CcPLRckOSNITUQtw_k3fRxfIO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ask=(msg,fn)=>{if(confirm(msg))fn()};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};

/* ---------- save status ---------- */
let inflight=0,hadErr=false;
function setStatus(t,bad){const el=$("sync");el.textContent=t;el.className=bad?"bad":""}
async function track(p){
  if(!inflight)hadErr=false;
  inflight++;setStatus("Saving...");
  try{
    const r=await p;
    if(r&&r.error)throw r.error;
    return r||{};
  }catch(e){hadErr=true;setStatus("Save failed: "+(e.message||e),true);return null}
  finally{inflight--;if(!inflight&&!hadErr)setStatus("Saved")}
}

/* ---------- shiny tracker ---------- */
const fields=[
["bought","Shinies Bought","bought"],["twoToOne","2:1 Shinies","two_to_one"],["oneOne","1:1 Shinies","one_one"],
["commons","Commons Sold","commons"],["uncommons","Uncommons Sold","uncommons"],["rares","Rares Sold","rares"],
["misc","Misc. Sold (List Price, $)","misc"],["start","Start date","start_date"],
["oneOnePrice","1:1 + amount ($ each)","one_one_price"],["commonPrice","Common price ($)","common_price"],
["uncommonPrice","Uncommon price ($)","uncommon_price"],["rarePrice","Rare price ($)","rare_price"],
["costEach","Cost per shiny bought ($)","cost_each"],["keptBack","Shinies kept back","kept_back"]
];
const PRICE=new Set(["oneOnePrice","commonPrice","uncommonPrice","rarePrice","costEach","keptBack"]);
const hostOf=k=>PRICE.has(k)?"prices":(k==="bought"||k==="start")?"inv":"inputs";
const short=n=>n>=1000&&n%1000===0?(n/1000)+"k":Number(n).toLocaleString("en-US");
function updateLabels(){
  const set=(k,txt)=>{const el=document.querySelector('label[for="'+k+'"]');if(el)el.textContent=txt};
  set("oneOne","1:1 + "+short(num("oneOnePrice"))+" Shinies");
  set("commons","Commons Sold ("+short(num("commonPrice"))+" per)");
  set("uncommons","Uncommon Sold ("+short(num("uncommonPrice"))+" per)");
  set("rares","Rare Sold ("+short(num("rarePrice"))+" per)");
}
const col=Object.fromEntries(fields.map(f=>[f[0],f[2]]));
const labelOf=k=>(fields.find(f=>f[0]===k)||[0,k])[1];
let s={bought:0,twoToOne:0,oneOne:0,commons:0,uncommons:0,rares:0,misc:0,start:"2026-04-11",oneOnePrice:1000,commonPrice:4000,uncommonPrice:6000,rarePrice:8000,costEach:1250,keptBack:1};
const committed={},els={};
const num=k=>Number(s[k])||0;
const fmt=n=>"$"+Math.round(n).toLocaleString("en-US");
const saveTimers={},dirty=new Set(),pendDelta={},deltaTimers={};
function queueSave(k){
  clearTimeout(saveTimers[k]);dirty.add("s"+k);
  saveTimers[k]=setTimeout(async()=>{
    const v=k==="start"?s.start:num(k);
    if(!(k==="start"&&!v))await track(sb.from("shiny_state").update({[col[k]]:v,updated_at:new Date().toISOString()}).eq("id",1));
    dirty.delete("s"+k);
  },500);
}
/* +/- buttons add to the value that is in the database right now, so a stale screen cannot overwrite another device */
function queueDelta(k,d){
  pendDelta[k]=(pendDelta[k]||0)+d;dirty.add("d"+k);
  clearTimeout(deltaTimers[k]);deltaTimers[k]=setTimeout(()=>flushDelta(k),400);
}
async function flushDelta(k){
  const d=pendDelta[k]||0;pendDelta[k]=0;
  if(!d){dirty.delete("d"+k);return}
  const r=await track(sb.from("shiny_state").select(col[k]).eq("id",1).single());
  if(!r||!r.data){dirty.delete("d"+k);return}
  const nv=Math.max(0,(Number(r.data[col[k]])||0)+d);
  const u=await track(sb.from("shiny_state").update({[col[k]]:nv,updated_at:new Date().toISOString()}).eq("id",1));
  dirty.delete("d"+k);
  if(u&&!pendDelta[k]){s[k]=nv;els[k].value=nv;committed[k]=nv;calc()}
}
fields.forEach(([k,l])=>{
  const host=$(hostOf(k));
  const d=document.createElement("div");d.className="card";
  d.innerHTML=`<label for="${k}">${l}</label><input id="${k}" type="${k==="start"?"date":"number"}" inputmode="numeric">`;
  host.appendChild(d);
  const el=d.querySelector("input");els[k]=el;
  el.addEventListener("input",()=>{s[k]=el.value;calc();queueSave(k)});
  el.addEventListener("change",()=>{logChange(k,committed[k],s[k]);committed[k]=s[k]});
  if(k!=="start"&&(!PRICE.has(k)||k==="keptBack")){
    const row=document.createElement("div");row.className="steps";
    [["+",1],["\u2212",-1]].forEach(([txt,dlt])=>{
      const b=document.createElement("button");b.type="button";b.textContent=txt;
      b.onclick=()=>{const o=num(k);s[k]=Math.max(0,o+dlt);el.value=s[k];calc();logChange(k,o,s[k]);committed[k]=s[k];queueDelta(k,s[k]-o)};
      row.appendChild(b);
    });
    d.appendChild(row);
  }
});
function calc(){
  updateLabels();
  const remaining=num("bought")-num("commons")-num("uncommons")-num("rares")+num("twoToOne")-num("keptBack");
  const profit11=num("oneOne")*num("oneOnePrice");
  const sold=num("commons")*num("commonPrice")+num("uncommons")*num("uncommonPrice")+num("rares")*num("rarePrice")+num("misc");
  const total=profit11+sold,cost=num("bought")*num("costEach"),net=total-cost;
  const st=new Date((s.start||"2026-04-11")+"T00:00:00");
  const now=new Date();now.setHours(0,0,0,0);
  const days=Math.max(1,Math.round((now-st)/864e5)+1);
  const avg=net/days;
  const card=([l,v,sign])=>`<div class="card"><div class="lbl">${l}</div><div class="val ${sign>0?"pos":sign<0?"neg":""}">${v}</div></div>`;
  $("outputs").innerHTML=[["Net Gain",fmt(net),net],["Average Net Per Day",fmt(avg),avg],["1:1 Profit",fmt(profit11)],["Sold Profit",fmt(sold)]].map(card).join("");
  $("invOut").innerHTML=[["Shinies Remaining",remaining,0],["Total Sales",fmt(total)],["Cost",fmt(cost)]].map(card).join("");
  $("days").textContent=`Day ${days} since ${s.start} (updates automatically with today's date)`;
}

/* ---------- history log ---------- */
let log=[],pend=null,pendTimer=null;
function renderLog(){
  $("histSum").textContent="History ("+log.length+")";
  const ul=$("hist");
  if(!log.length){ul.innerHTML='<li class="empty">No changes logged yet.</li>';return}
  ul.innerHTML=log.map(e=>{
    const d=new Date(e.t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
    return `<li><div><div>${esc(labelOf(e.k))}</div><div class="when">${d}</div></div><div class="chg">${esc(e.from)} \u2192 ${esc(e.to)}</div></li>`;
  }).join("");
}
function logChange(k,from,to){
  if(String(from)===String(to))return;
  if(pend&&pend.k===k&&pend===log[0]){
    pend.to=to;pend.t=Date.now();
    if(String(pend.from)===String(pend.to)){log.shift();pend=null;clearTimeout(pendTimer);renderLog();return}
  }else{
    flushLog();
    pend={id:null,t:Date.now(),k:k,from:from,to:to};log.unshift(pend);
  }
  clearTimeout(pendTimer);pendTimer=setTimeout(flushLog,4000);
  renderLog();
}
async function flushLog(){
  clearTimeout(pendTimer);
  const e=pend;pend=null;if(!e)return;
  const r=await track(sb.from("shiny_log").insert({at:new Date(e.t).toISOString(),field:e.k,old_value:String(e.from),new_value:String(e.to)}).select("id").single());
  if(r&&r.data)e.id=r.data.id;
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)flushLog()});
$("clearLog").onclick=()=>ask("Clear the history log?",async()=>{
  pend=null;clearTimeout(pendTimer);
  const r=await track(sb.from("shiny_log").delete().gt("id",0));
  if(r){log=[];renderLog()}
});

/* ---------- epic tracker ---------- */
let epics=[],eq="";
const sk=n=>n.toLowerCase().replace(/[^a-z0-9]/g,"");
const sortEpics=()=>epics.sort((a,b)=>sk(a.name)<sk(b.name)?-1:sk(a.name)>sk(b.name)?1:a.id-b.id);
function holderMap(){
  const m={};
  epics.forEach(e=>e.holders.forEach((h,i)=>{h=h.trim();if(!h)return;const k=h.toLowerCase();(m[k]=m[k]||{n:h,items:[]}).items.push(e.name+" #"+(i+1))}));
  return Object.values(m).sort((a,b)=>b.items.length-a.items.length||a.n.localeCompare(b.n));
}
function matches(e){
  if(!eq)return true;const t=eq.toLowerCase();
  return e.name.toLowerCase().includes(t)||e.holders.some(h=>h.toLowerCase().includes(t));
}
function renderEpics(){
  const t=eq.toLowerCase();
  const list=epics.map((e,i)=>[e,i]).filter(([e])=>matches(e));
  $("epicList").innerHTML=list.map(([e,i])=>`<div class="card ep" data-i="${i}">
<div class="eph"><strong title="${esc(e.name)}"${e.name.length>20?` style="font-size:${e.name.length>26?12:14}px"`:""}>${esc(e.name)}</strong><button type="button" class="x" data-act="del" aria-label="Delete epic">\u2715</button></div>
${e.holders.map((h,j)=>`<div class="slot${t&&h.toLowerCase().includes(t)?" hit":""}"><span>#${j+1}</span><input data-j="${j}" list="holderDL" placeholder="unknown" value="${esc(h)}"></div>`).join("")}
<div class="steps"><button type="button" data-act="add">+ slot</button><button type="button" data-act="rem">\u2212 slot</button></div></div>`).join("")||'<div class="empty">No matches.</div>';
}
function renderMeta(){
  const hm=holderMap();
  let known=0,unk=0;epics.forEach(e=>e.holders.forEach(h=>h.trim()?known++:unk++));
  $("epSum").textContent=`${epics.length} epics \u00b7 ${known} known holders \u00b7 ${unk} unknown slots \u00b7 ${hm.length} users`;
  $("holderDL").innerHTML=hm.map(h=>`<option value="${esc(h.n)}">`).join("");
  const t=eq.toLowerCase();
  const hl=hm.filter(h=>!t||h.n.toLowerCase().includes(t)||h.items.some(x=>x.toLowerCase().includes(t)));
  $("holderList").innerHTML=hl.map(h=>`<div class="card"><div class="eph"><strong title="${esc(h.n)}">${esc(h.n)}</strong><span class="lbl" style="margin:0">${h.items.length}</span></div>${h.items.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`).join("")||'<div class="empty">No matches.</div>';
}
function setView(v){
  $("epicList").hidden=v!=="epic";$("holderList").hidden=v!=="holder";
  $("vEpic").classList.toggle("on",v==="epic");$("vHolder").classList.toggle("on",v==="holder");
}
const slotTimers={};
function schedSlot(e,j){
  const key=e.id+":"+j;clearTimeout(slotTimers[key]);dirty.add("e"+key);
  slotTimers[key]=setTimeout(async()=>{
    const v=e.holders[j];
    if(v!==undefined)await track(sb.from("epic_slots").upsert({epic_id:e.id,slot:j+1,holder:v}));
    dirty.delete("e"+key);
  },600);
}
const epicList=$("epicList");
epicList.addEventListener("input",ev=>{
  const inp=ev.target.closest("input");if(!inp)return;
  const e=epics[+inp.closest(".ep").dataset.i],j=+inp.dataset.j;
  e.holders[j]=inp.value;schedSlot(e,j);
});
epicList.addEventListener("change",renderMeta);
epicList.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  const e=epics[+b.closest(".ep").dataset.i],a=b.dataset.act;
  const done=()=>{renderEpics();renderMeta()};
  if(a==="add"){
    e.holders.push("");done();
    track(sb.from("epic_slots").upsert({epic_id:e.id,slot:e.holders.length,holder:""},{ignoreDuplicates:true}));
  }else if(a==="rem"){
    if(e.holders.length<=1)return;
    const n=e.holders.length,last=e.holders[n-1];
    const go=()=>{e.holders.pop();done();track(sb.from("epic_slots").delete().eq("epic_id",e.id).eq("slot",n))};
    if(last.trim())ask("Remove slot #"+n+" ("+last+")?",go);else go();
  }else if(a==="del"){
    ask("Delete epic \u201c"+e.name+"\u201d?",()=>{
      epics.splice(epics.indexOf(e),1);done();
      track(sb.from("epics").delete().eq("id",e.id));
    });
  }
});
$("epSearch").addEventListener("input",ev=>{eq=ev.target.value.trim();renderEpics();renderMeta()});
$("vEpic").onclick=()=>setView("epic");
$("vHolder").onclick=()=>setView("holder");
$("addEpic").onclick=async()=>{
  const n=$("newEpic").value.trim();if(!n)return;
  const r=await track(sb.from("epics").insert({name:n}).select("id").single());
  if(!r||!r.data)return;
  await track(sb.from("epic_slots").insert({epic_id:r.data.id,slot:1,holder:""}));
  epics.push({id:r.data.id,name:n,holders:[""]});sortEpics();
  $("newEpic").value="";eq=n;$("epSearch").value=n;setView("epic");renderEpics();renderMeta();
};
$("newEpic").addEventListener("keydown",ev=>{if(ev.key==="Enter")$("addEpic").click()});

/* ---------- tabs ---------- */
let zoom=Number(LS("tracker.zoom"))||0.8;
function applyZoom(){
  zoom=Math.min(1.5,Math.max(0.4,Math.round(zoom*10)/10));
  $("mapWrap").style.setProperty("--z",zoom);
  $("zVal").textContent=Math.round(zoom*100)+"%";

det.open=LS("tracker.more")==="1";
det.addEventListener("toggle",()=>LS("tracker.more",det.open?"1":"0"));

/* ---------- load from database ---------- */
async function loadAll(quiet){
  if(!quiet)setStatus("Loading...");
  const [st,lg,ep,sl]=await Promise.all([
    sb.from("shiny_state").select("*").eq("id",1).maybeSingle(),
    sb.from("shiny_log").select("*").order("at",{ascending:false}).limit(200),
    sb.from("epics").select("*"),
    sb.from("epic_slots").select("*")
  ]);
  const err=st.error||lg.error||ep.error||sl.error;
  if(err){setStatus("Load failed: "+err.message,true);return false}
  if(!st.data)await sb.from("shiny_state").insert({id:1});
  const r=st.data||{};
  s={bought:r.bought??0,twoToOne:r.two_to_one??0,oneOne:r.one_one??0,commons:r.commons??0,uncommons:r.uncommons??0,rares:r.rares??0,misc:r.misc??0,start:r.start_date||"2026-04-11",oneOnePrice:r.one_one_price??1000,commonPrice:r.common_price??4000,uncommonPrice:r.uncommon_price??6000,rarePrice:r.rare_price??8000,costEach:r.cost_each??1250,keptBack:r.kept_back??1};
  fields.forEach(([k])=>{els[k].value=s[k];committed[k]=s[k]});
  log=lg.data.map(x=>({id:x.id,t:Date.parse(x.at),k:x.field,from:x.old_value,to:x.new_value}));
  const bySlot={};
  sl.data.forEach(x=>{(bySlot[x.epic_id]=bySlot[x.epic_id]||[])[x.slot-1]=x.holder});
  epics=ep.data.map(e=>({id:e.id,name:e.name,holders:Array.from(bySlot[e.id]||[""],h=>h||"")}));
  sortEpics();
  calc();renderLog();renderEpics();renderMeta();
  if(!quiet)setStatus("Saved");
  return true;
}

/* ---------- import / export ---------- */
function exportObj(){
  return {v:1,shiny:{bought:s.bought,twoToOne:s.twoToOne,oneOne:s.oneOne,commons:s.commons,uncommons:s.uncommons,rares:s.rares,misc:s.misc,start:s.start,oneOnePrice:s.oneOnePrice,commonPrice:s.commonPrice,uncommonPrice:s.uncommonPrice,rarePrice:s.rarePrice,costEach:s.costEach,keptBack:s.keptBack},
    log:log.map(e=>({t:e.t,k:e.k,from:e.from,to:e.to})),epics:epics.map(e=>({name:e.name,holders:e.holders}))};
}
$("bkExport").onclick=()=>{
  const el=$("bkText");el.value=JSON.stringify(exportObj());el.focus();el.select();
  try{navigator.clipboard.writeText(el.value)}catch(e){}
  $("bkMsg").textContent="Exported. Copied to clipboard if your browser allows it.";
};
$("bkImport").onclick=()=>{
  let o;
  try{o=JSON.parse($("bkText").value)}catch(e){$("bkMsg").textContent="That is not valid exported data.";return}
  if(!o||!Array.isArray(o.epics)||!o.shiny){$("bkMsg").textContent="That does not look like exported tracker data.";return}
  ask("Replace everything in the database with this data?",async()=>{
    const msg=$("bkMsg");msg.textContent="Importing...";
    const sh=o.shiny,n=v=>Number(v)||0,pr=(v,d)=>v===undefined?d:n(v);
    let r=await track(sb.from("shiny_state").upsert({id:1,bought:n(sh.bought),two_to_one:n(sh.twoToOne),one_one:n(sh.oneOne),commons:n(sh.commons),uncommons:n(sh.uncommons),rares:n(sh.rares),misc:n(sh.misc),start_date:sh.start||"2026-04-11",one_one_price:pr(sh.oneOnePrice,1000),common_price:pr(sh.commonPrice,4000),uncommon_price:pr(sh.uncommonPrice,6000),rare_price:pr(sh.rarePrice,8000),cost_each:pr(sh.costEach,1250),kept_back:pr(sh.keptBack,1),updated_at:new Date().toISOString()}));
    if(!r){msg.textContent="Import failed at the numbers step.";return}
    r=await track(sb.from("shiny_log").delete().gt("id",0));
    if(!r){msg.textContent="Import failed clearing the log.";return}
    const lg=(o.log||[]).map(e=>({at:new Date(e.t).toISOString(),field:String(e.k),old_value:String(e.from),new_value:String(e.to)}));
    for(let i=0;i<lg.length;i+=200){
      r=await track(sb.from("shiny_log").insert(lg.slice(i,i+200)));
      if(!r){msg.textContent="Import failed writing the log.";return}
    }
    r=await track(sb.from("epics").delete().gt("id",0));
    if(!r){msg.textContent="Import failed clearing epics.";return}
    if(o.epics.length){
      r=await track(sb.from("epics").insert(o.epics.map(e=>({name:String(e.name)}))).select("id,name"));
      if(!r||!r.data){msg.textContent="Import failed writing epics.";return}
      const slots=[];
      r.data.forEach((row,i)=>(o.epics[i].holders||[""]).forEach((h,j)=>slots.push({epic_id:row.id,slot:j+1,holder:String(h||"")})));
      for(let i=0;i<slots.length;i+=200){
        const q=await track(sb.from("epic_slots").insert(slots.slice(i,i+200)));
        if(!q){msg.textContent="Import failed writing holders.";return}
      }
    }
    await loadAll();
    msg.textContent="Import finished: "+o.epics.length+" epics.";
  });
};

/* ---------- live sync between devices ---------- */
let chan=null,rTimer=null;
function busy(){
  const a=document.activeElement;
  return inflight>0||dirty.size>0||pend!==null||!!(a&&a.closest&&a.closest("#inputs,#inv,#epicList"));
}
function scheduleRefresh(ms){clearTimeout(rTimer);rTimer=setTimeout(doRefresh,ms||500)}
async function doRefresh(){
  if($("app").hidden)return;
  if(busy()){scheduleRefresh(1500);return}
  await loadAll(true);
}
function subscribe(){
  if(chan)return;
  chan=sb.channel("tracker-sync");
  ["shiny_state","shiny_log","epics","epic_slots"].forEach(tb=>chan.on("postgres_changes",{event:"*",schema:"public",table:tb},()=>scheduleRefresh(500)));
  chan.subscribe();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)scheduleRefresh(200)});
window.addEventListener("focus",()=>scheduleRefresh(200));
window.addEventListener("online",()=>scheduleRefresh(200));

/* ---------- login ---------- */
function showLogin(){
  $("app").hidden=true;$("login").hidden=false;$("lgPass").value="";
}
async function enter(){
  $("login").hidden=true;$("app").hidden=false;
  showTab(LS("tracker.tab")||"shiny");setView("epic");
  calc();renderLog();
  await loadAll();
  subscribe();
}
async function doLogin(){
  $("lgErr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("lgEmail").value.trim(),password:$("lgPass").value});
  if(error){$("lgErr").textContent=error.message;return}
  enter();
}
$("lgGo").onclick=doLogin;
$("lgPass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
$("signOut").onclick=async()=>{await flushLog();if(chan){sb.removeChannel(chan);chan=null}await sb.auth.signOut();showLogin()};
(async()=>{
  const {data}=await sb.auth.getSession();
  if(data&&data.session)enter();else showLogin();
})();
